name: Daily Autonomous Shorts Factory

on:
  schedule:
    - cron: '0 15 * * *'
  workflow_dispatch:

jobs:
  build-and-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Python 3.12
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-liberation

      - name: Install Python Packages
        run: |
          python -m pip install --upgrade pip
          pip install edge-tts moviepy imageio-ffmpeg pillow requests google-api-python-client google-auth-oauthlib google-auth-httplib2

      - name: Run Daily Cloud Pipeline
        run: python run_daily_cloud.py
