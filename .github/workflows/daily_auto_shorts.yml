name: Daily Autonomous Shorts Factory

on:
  schedule:
    # Runs automatically every single day at 15:00 UTC (18:00 Turkey Time)
    - cron: '0 15 * * *'
  workflow_dispatch: # Allows manual 1-click trigger from GitHub anytime

jobs:
  build-and-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Python 3.12
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install System Dependencies (FFmpeg & Fonts)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-liberation

      - name: Install Python Packages
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install google-api-python-client google-auth-oauthlib google-auth-httplib2

      - name: Restore Credentials from GitHub Secrets
        env:
          TOKEN_JSON: ${{ secrets.TOKEN_JSON }}
          CLIENT_SECRETS_JSON: ${{ secrets.CLIENT_SECRETS_JSON }}
        run: |
          echo "$TOKEN_JSON" > token.json
          echo "$CLIENT_SECRETS_JSON" > client_secrets.json

      - name: Run Daily Cloud Pipeline
        run: python run_daily_cloud.py
