name: Daily Autonomous Shorts Factory (4 Channels)

on:
  schedule:
    # Runs automatically every single day at 15:00 UTC (18:00 Turkey Time)
    - cron: '0 15 * * *'
  workflow_dispatch: # Allows manual 1-click trigger from GitHub anytime

jobs:
  build-and-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Python 3.12
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install System Dependencies (FFmpeg & Fonts)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-liberation

      - name: Install Python Packages
        run: |
          python -m pip install --upgrade pip
          pip install --no-cache-dir -r requirements.txt
          pip install --no-cache-dir google-api-python-client google-auth-oauthlib google-auth-httplib2

      - name: Restore Credentials for All 4 Channels from GitHub Secrets
        env:
          TOKEN_JSON: ${{ secrets.TOKEN_JSON }}
          CLIENT_SECRETS_JSON: ${{ secrets.CLIENT_SECRETS_JSON }}
          TOKEN_BIBLE: ${{ secrets.TOKEN_BIBLE }}
          CLIENT_SECRETS_BIBLE: ${{ secrets.CLIENT_SECRETS_BIBLE }}
          TOKEN_HEALTH: ${{ secrets.TOKEN_HEALTH }}
          CLIENT_SECRETS_HEALTH: ${{ secrets.CLIENT_SECRETS_HEALTH }}
          TOKEN_KIDS: ${{ secrets.TOKEN_KIDS }}
          CLIENT_SECRETS_KIDS: ${{ secrets.CLIENT_SECRETS_KIDS }}
        run: |
          echo "$TOKEN_JSON" > token.json
          echo "$CLIENT_SECRETS_JSON" > client_secrets.json
          echo "$TOKEN_BIBLE" > token_bible.json
          echo "$CLIENT_SECRETS_BIBLE" > client_secrets_bible.json
          echo "$TOKEN_HEALTH" > token_health.json
          echo "$CLIENT_SECRETS_HEALTH" > client_secrets_health.json
          echo "$TOKEN_KIDS" > token_kids.json
          echo "$CLIENT_SECRETS_KIDS" > client_secrets_kids.json

      - name: Run Multi-Channel Cloud Pipeline
        run: python run_all_channels_cloud.py
